<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodePulse // Hackathon Authenticity Audit</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0b0f19; color: #f0f6fc; padding: 40px; margin: 0; }
        .box { max-width: 700px; margin: 0 auto; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 30px; }
        h1 { color: #4493f8; margin-top: 0; font-size: 24px; }
        .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
        label { font-size: 14px; color: #c9d1d9; font-weight: 500; }
        input, textarea { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 12px; color: #fff; font-size: 14px; }
        textarea { font-family: monospace; height: 120px; resize: vertical; }
        button { background: #238636; border: none; border-radius: 6px; padding: 12px; color: white; font-weight: bold; cursor: pointer; font-size: 14px; }
        button:hover { background: #2ea043; }
        .report { margin-top: 25px; padding-top: 20px; border-top: 1px solid #30363d; display: none; }
        .score { font-size: 36px; font-weight: bold; color: #58a6ff; margin: 10px 0; }
        .warning { color: #f85149; font-weight: bold; }
        .pass { color: #56d364; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h1>CodePulse Portal</h1>
        <p style="color: #8b949e; font-size: 14px; margin-top: -10px;">Hackathon Verification System: AI vs Human Contribution Scanner</p>
        
        <div class="field">
            <label>GitHub Repository Link</label>
            <input type="text" id="repoUrl" placeholder="https://github.com">
        </div>
        <div class="field">
            <label>Total Project Commits</label>
            <input type="number" id="commits" value="1">
        </div>
        <div class="field">
            <label>Main Server/Logic Code Sample</label>
            <textarea id="codeSample" placeholder="// Paste a file or main code snippet here..."></textarea>
        </div>

        <button onclick="triggerAudit()">Analyze Submission Authenticity</button>

        <div class="report" id="reportView">
            <div class="score" id="scoreOut">--%</div>
            <p id="verdictOut"></p>
            <ul id="flagLogs" style="font-size: 13px; color: #8b949e; padding-left: 20px;"></ul>
        </div>
    </div>

    <script>
        async function triggerAudit() {
            const repoUrl = document.getElementById('repoUrl').value;
            const commits = document.getElementById('commits').value;
            const codeSample = document.getElementById('codeSample').value;

            if(!repoUrl || !codeSample) {
                alert('Please fill out the repository link and code sample boxes.');
                return;
            }

            const response = await fetch('/api/audit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ repoUrl, commits, codeSample })
            });

            const data = await response.json();
            
            document.getElementById('reportView').style.display = 'block';
            document.getElementById('scoreOut').innerText = data.score + '% Human Contribution Score';
            
            const verdict = document.getElementById('verdictOut');
            verdict.innerText = "Verdict: " + data.verdict;
            verdict.className = data.score < 60 ? 'warning' : 'pass';

            const logs = document.getElementById('flagLogs');
            logs.innerHTML = '';
            
            if (data.flags.length === 0) {
                logs.innerHTML = '<li>Passed all baseline automated human-contribution checks.</li>';
            } else {
                data.flags.forEach(f => { logs.innerHTML += `<li>${f}</li>`; });
            }
        }
    </script>
</body>
</html>
